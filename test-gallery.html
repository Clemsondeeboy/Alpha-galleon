<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test-gallery</title>


    <style>
        *{
            padding: 0;
            margin: 0;
        }
        .gallery .item1.food{
        background-image:linear-gradient(rgba(60, 60, 90, 0.438)), url('images/Property\ 1=Default.png');
        width: 100%;
        background-size: cover;
        background-repeat: no-repeat;
        height: auto;
        display: block;
        border-radius: 5px;
        transition: all .4s ease-in-out;

     .gallery h4.aphagileon-food{
      padding-top: 150px;
      padding-bottom: 150px;
      display: none;
      color: #fff;
      height: 100%;
      transition: all .5s ease-in-out;
      text-align: center;
      font-size: 16px;
        }
        }
        .gallery .food:hover{
            transform: scale(1.1);

            .aphagileon-food{
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="gallery">
